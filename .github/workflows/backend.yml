name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./test_seo.db
      PYTHONPATH: ${{ github.workspace }}
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key
      CORS_ORIGINS: '*'
      ALLOWED_HOSTS: '*'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy-backend.sh
          bash -n scripts/smoke-backend.sh
          bash scripts/deploy-backend.sh | tee /tmp/deploy-dry-run.txt
          grep -q "DRY RUN ONLY" /tmp/deploy-dry-run.txt
          cat > .env.backend <<'EOF'
          ENVIRONMENT=production
          DATABASE_URL=postgresql://ci:ci@db.example.invalid:5432/seo
          SECRET_KEY=ci-only-not-a-real-secret
          CORS_ORIGINS=*
          ALLOWED_HOSTS=*
          EOF
          docker compose -f docker-compose.backend.yml config -q
          rm -f .env.backend

      - name: Lint backend
        run: |
          ruff check app tests

      - name: Validate Alembic migrations
        run: |
          alembic upgrade head

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=70 -q

      - name: Build protected frontend
        run: |
          bash scripts/build-agent-frontend.sh

      - name: Build Docker image
        run: |
          docker build .
