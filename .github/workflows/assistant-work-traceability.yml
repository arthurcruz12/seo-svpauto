name: Assistant Work Traceability

on:
  push:
    branches:
      - feature/assistant-work-traceability
  pull_request:
    branches:
      - agent/substituir-sistema-operacional
  workflow_dispatch:

jobs:
  backend-work-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q backend/tests/test_work_traceability.py
      - run: python -m pytest -q backend/tests/test_password_security.py
