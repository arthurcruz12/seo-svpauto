services:
  api:
    build:
      context: ./backend
    container_name: seo-api
    restart: unless-stopped
    environment:
      SEO_ENV: development
      SEO_DATABASE_PATH: /app/storage/seo.sqlite3
      OCR_LANGUAGE: por+eng
    ports:
      - "8000:8000"
    volumes:
      - seo_api_storage:/app/storage

  postgres:
    image: postgres:16
    container_name: seo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: seo
      POSTGRES_USER: seo_user
      POSTGRES_PASSWORD: seo_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - seo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo_user -d seo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  seo_api_storage:
  seo_postgres_data:
