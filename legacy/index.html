    <title>SEO - Sistema de Eficiência Operacional</title>
    <script>
      (() => {
        const localBase = 'http://127.0.0.1:8000';
        const proxyBase = '/seo-api';
        const nativeFetch = window.fetch.bind(window);

        const rewriteUrl = (value) => {
          const url = String(value);
          return url.startsWith(localBase)
            ? `${proxyBase}${url.slice(localBase.length)}`
            : url;
        };

        window.fetch = (input, init) => {
          if (typeof input === 'string' || input instanceof URL) {
            return nativeFetch(rewriteUrl(input), init);
          }
          if (input instanceof Request && input.url.startsWith(localBase)) {
            return nativeFetch(new Request(rewriteUrl(input.url), input), init);
          }
          return nativeFetch(input, init);
        };
      })();
    </script>
