services:
  seo-backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.backend
    environment:
      SEO_ARTIFACT_STORAGE_PATH: /var/lib/seo/agent-storage
      SEO_ARTIFACT_STORAGE_PROVIDER: local
      SNC_WRITE_ENABLED: "false"
      SAFT_INTEGRATION_ENABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - seo_agent_storage:/var/lib/seo/agent-storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  seo_agent_storage:
    name: seo_agent_storage
